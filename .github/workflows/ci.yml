name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -C packages/core test

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demos
        run: |
          pnpm -C apps/demo exec vite build --base=/
          pnpm -C apps/demo-vue exec vite build --base=/vue/
          mkdir -p out/vue
          cp -r apps/demo/dist/* out/
          cp -r apps/demo-vue/dist/* out/vue/

      - name: Deploy to Cloudflare Workers (static assets)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm exec wrangler deploy

      - name: Skipped (no token)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "未配置 CLOUDFLARE_API_TOKEN secret，跳过部署。配置后重跑即可。"
