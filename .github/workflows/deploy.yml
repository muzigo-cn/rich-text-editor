name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React demo
        run: pnpm -C apps/demo exec vite build --base=/rich-text-editor/

      - name: Build Vue demo
        run: pnpm -C apps/demo-vue exec vite build --base=/rich-text-editor/vue/

      - name: Merge demo outputs
        run: |
          mkdir -p pages/vue
          cp -r apps/demo/dist/* pages/
          cp -r apps/demo-vue/dist/* pages/vue/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
